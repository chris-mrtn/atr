<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Club</title>
<meta name="description" content="What we've watched and whose turn it is to pick.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%238a3324'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='3' width='2' height='2'/%3E%3Crect x='3' y='7' width='2' height='2'/%3E%3Crect x='3' y='11' width='2' height='2'/%3E%3Crect x='11' y='3' width='2' height='2'/%3E%3Crect x='11' y='7' width='2' height='2'/%3E%3Crect x='11' y='11' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main>
  <header>
    <h1 id="club-name">Movie Club</h1>
    <p class="tagline" id="club-tagline"></p>
  </header>

  <section aria-labelledby="turn-heading">
    <h2 id="turn-heading">Whose turn to pick</h2>
    <div class="turn">
      <p class="turn-name" id="next-picker">&hellip;</p>
      <p class="turn-note" id="turn-note"></p>
      <ul class="order" id="rotation-order"></ul>
    </div>
  </section>

  <section aria-labelledby="archive-heading">
    <h2 id="archive-heading">What we've watched</h2>
    <ul class="archive" id="archive"></ul>
  </section>

  <footer>
    Add a film or change the rotation by editing <code>data/club.json</code>.
  </footer>
</main>
<script src="assets/app.js"></script>
</body>
</html>
