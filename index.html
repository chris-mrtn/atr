<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avoid The Rut</title>
<meta name="description" content="Every film the club has watched, year by year.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%238a3324'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='3' width='2' height='2'/%3E%3Crect x='3' y='7' width='2' height='2'/%3E%3Crect x='3' y='11' width='2' height='2'/%3E%3Crect x='11' y='3' width='2' height='2'/%3E%3Crect x='11' y='7' width='2' height='2'/%3E%3Crect x='11' y='11' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght,wdth@200..900,75..125&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<button id="stats-toggle" class="stats-toggle" type="button" aria-pressed="false" aria-controls="stats-page" aria-label="View stats" title="Stats">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21v-6"/><path d="M12 21V3"/><path d="M19 21V9"/></svg>
</button>
<section id="stats-page" class="stats-page" hidden aria-hidden="true">
  <!-- Content comes next - for now this is just the fade-to/from-main scaffolding. -->
</section>
<section id="filter-overlay" class="filter-overlay" hidden aria-hidden="true" role="dialog" aria-label="Filters">
  <!-- Populated by setupArchiveFilters() in app.js - a "Filters" title and
       one section per filter category. -->
</section>
<!-- A sibling of #filter-overlay, not a child of it, same as #stats-toggle
     is a sibling of #stats-page - .filter-overlay fades in via opacity,
     which isolates any mix-blend-mode inside it from the real page
     backdrop (the animated blobs), so a vibrancy-blended close button
     living inside that fade would only ever blend against the overlay's
     own empty background instead. Staying outside it is what lets this
     button's "x" light up against the backdrop the same way the stats
     close button's does. -->
<button id="filter-overlay-close" class="filter-overlay-close" type="button" aria-label="Close filters" hidden>&times;</button>
<main>
  <header class="masthead">
    <h1>ATR</h1>
    <p class="stats" id="stats" aria-live="polite">Loading&hellip;</p>
  </header>

  <section id="hero" hidden></section>

  <div class="archive-toolbar">
    <h2 class="archive-head">Archive</h2>
    <div class="archive-toolbar-right">
      <button id="filters-toggle" class="filters-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-overlay" aria-label="Filters" title="Filters">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h20"/><path d="M6 12h12"/><path d="M9 19h6"/></svg>
      </button>
      <div id="year-filters" class="year-filters"></div>
      <div id="view-toggle" class="view-toggle" role="group" aria-label="Archive view">
        <button type="button" class="view-toggle-btn is-active" data-view="list" aria-label="List view" title="List">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H3"/><path d="M15 12H3"/><path d="M17 19H3"/></svg>
        </button>
        <button type="button" class="view-toggle-btn" data-view="grid" aria-label="Grid view" title="Grid">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="filter-chips" class="filter-chips" hidden></div>
  <div id="years"></div>

  <footer>
    <p id="tmdb-note"></p>
    <p>Film list from <a href="https://letterboxd.com/chrismrtn/">Letterboxd</a>.</p>
  </footer>
</main>
<script src="assets/app.js"></script>
<script src="assets/dev-reload.js"></script>
</body>
</html>
