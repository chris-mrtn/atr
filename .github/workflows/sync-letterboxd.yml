name: Sync Letterboxd

on:
  schedule:
    # 06:15 UTC daily. Off the hour so we are not in the crowd of :00 jobs.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      retry_unmatched:
        description: 'Retry films TMDB could not previously identify'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-letterboxd.yml'

# Only what the job needs: it commits the data files and nothing else.
permissions:
  contents: write

concurrency:
  group: sync-letterboxd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Parser and matching tests run first: if the shape of the data changed,
      # fail here rather than committing something wrong.
      - name: Test
        run: node --test scripts/*.test.mjs

      - name: Sync film list from Letterboxd
        run: node scripts/sync.mjs

      - name: Enrich with TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ "${{ inputs.retry_unmatched }}" = "true" ]; then
            node scripts/enrich.mjs --retry-unmatched
          else
            node scripts/enrich.mjs
          fi

      - name: Commit if the data changed
        run: |
          # Stage first: `git diff` alone cannot see a file git has never
          # tracked, so on the run that creates a data file it would report
          # no change and skip the commit.
          git add -- data/
          if git diff --cached --quiet -- data/; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync films from Letterboxd and TMDB

          Automated by .github/workflows/sync-letterboxd.yml"
          git push

      - name: Summary
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"
