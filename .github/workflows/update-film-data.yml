name: Update film data

# Manual only - the archive only changes when a new film gets added, so
# there is nothing worth running on a fixed schedule. Run this from the
# Actions tab (or `gh workflow run update-film-data.yml`) whenever there is
# actually something new to pull in. `node scripts/update-data.mjs` does the
# same two steps locally in one go, for whenever that is more convenient
# than going through Actions.
on:
  workflow_dispatch:
    inputs:
      retry_unmatched:
        description: 'Retry films TMDB could not previously identify'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-film-data.yml'

# Only what the job needs: it commits the data files and nothing else.
permissions:
  contents: write

concurrency:
  group: update-film-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Match-rule tests run first: if the shape of the data changed, fail
      # here rather than committing something wrong.
      - name: Test
        run: node --test scripts/*.test.mjs

      - name: Enrich with TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ "${{ inputs.retry_unmatched }}" = "true" ]; then
            node scripts/enrich.mjs --retry-unmatched
          else
            node scripts/enrich.mjs
          fi

      # Add OMDB_API_KEY at Settings > Secrets and variables > Actions to
      # turn this on - a free key from https://www.omdbapi.com/apikey.aspx.
      # Until then this step is a harmless no-op: unlike TMDB_API_KEY, a
      # missing OMDb key just logs a warning and moves on rather than
      # failing the run.
      - name: Backfill IMDb ratings
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/imdb-ratings.mjs

      # Pre-samples each poster's colours into data/poster-colors.json, so
      # the site doesn't have to download and sample posters in the browser
      # (see scripts/poster-colors.py). Only new posters get downloaded.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sample poster colours
        run: |
          pip install --quiet pillow
          python scripts/poster-colors.py

      - name: Commit if the data changed
        run: |
          # Stage first: `git diff` alone cannot see a file git has never
          # tracked, so on the run that creates a data file it would report
          # no change and skip the commit.
          git add -- data/
          if git diff --cached --quiet -- data/; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update TMDB/IMDb film data

          Automated by .github/workflows/update-film-data.yml"
          git push

      - name: Summary
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"
